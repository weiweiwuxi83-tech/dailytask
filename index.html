<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="每日任务清单，支持图片、文本和表格备注。" />
    <title>DailyTask</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="日常清单首页">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <span>日常清单</span>
        </a>
        <span class="local-badge"><span aria-hidden="true"></span>仅保存在此设备</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow" id="today-label">今天</p>
        <h1 id="page-title">把今天过得<span>更有条理。</span></h1>
        <p class="intro-copy">先完成一件小事，然后让事情变得更清楚。</p>
      </section>

      <section class="progress-card" aria-label="今日完成进度">
        <div class="progress-copy">
          <div>
            <p class="card-label">今日进度</p>
            <p class="progress-number">
              <strong id="progress-percent">0%</strong>
              <span id="progress-summary">还没有任务</span>
            </p>
          </div>
          <div class="progress-icon" aria-hidden="true">✦</div>
        </div>
        <div class="progress-track" role="progressbar" aria-label="任务完成百分比" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progress-fill"></span>
        </div>
      </section>

      <section class="task-section" aria-labelledby="tasks-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">专注当下</p>
            <h2 id="tasks-heading">今日任务 <span id="task-count">0</span></h2>
          </div>
          <button class="text-button" id="clear-completed" type="button" hidden>清除已完成</button>
        </div>

        <form class="add-form" id="task-form">
          <label class="visually-hidden" for="task-input">添加一项任务</label>
          <span class="input-plus" aria-hidden="true">＋</span>
          <input id="task-input" name="task" type="text" maxlength="120" placeholder="今天想完成什么？" autocomplete="off" required />
          <label class="visually-hidden" for="task-category">任务分类</label>
          <select id="task-category" name="category" aria-label="任务分类">
            <option value="life">生活</option>
            <option value="work">工作</option>
            <option value="study">学习</option>
          </select>
          <button class="add-button" type="submit">添加任务</button>
        </form>

        <div class="filter-row" role="group" aria-label="筛选任务">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">待完成</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
        </div>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>

        <div class="empty-state" id="empty-state">
          <span class="empty-illustration" aria-hidden="true">✎</span>
          <p class="empty-title">先写下一件要做的事</p>
          <p class="empty-copy">小小的一步，也值得认真对待。</p>
        </div>
      </section>

      <footer class="footer-note">每一天，都是重新开始的好时机。</footer>
    </main>
  </body>
</html>
